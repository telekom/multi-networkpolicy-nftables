on:
  push:
    branches:
      - main
      - master
      - nftables
  pull_request:
name: test
permissions:
  contents: read
jobs:
  test:
    env:
      NFTEST_SKIP_IF_UNAVAILABLE: "1"
      # The tc flower kernel tests must run here, not skip.
      TCFLOWER_REQUIRE_KERNEL_TESTS: "1"
    strategy:
      matrix:
        go-version: ["1.25.13"]
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
        cache: true

    - name: Run Revive Action by pulling pre-built image
      uses: docker://morphy/revive-action:v2
      with:
        exclude: "./vendor/..."

    - name: Run go fmt
      run: make fmt

    - name: Run go vet
      run: make vet

    # Same gate change as in govulncheck.yml. A vulnerability report must not
    # stop the fmt, vet and test steps that follow it in this job.
    - name: Run govulncheck
      id: govulncheck
      continue-on-error: true
      run: make govulncheck

    - name: Report govulncheck outcome
      if: steps.govulncheck.outcome == 'failure'
      run: |
        echo "::warning::govulncheck reported findings. Read the 'Run govulncheck' step for the details. This does not fail CI."

    - name: Run go env toolchain
      run: go env -w GOTOOLCHAIN=go${{ matrix.go-version }}+auto

    - name: Install envtest assets
      run: |
        go install sigs.k8s.io/controller-runtime/tools/setup-envtest@v0.24.1
        mkdir -p testbin/k8s
        echo "KUBEBUILDER_ASSETS=$(setup-envtest use 1.35.0 --bin-dir testbin/k8s -p path)" >> "$GITHUB_ENV"

    - name: Load kernel modules
      # act_ct is for the tc flower backend's conntrack test in pkg/tcflower.
      run: |
        sudo modprobe nft_ct
        sudo modprobe act_ct

    - name: Test unprivileged packages
      run: make test-unprivileged

    - name: Test all packages with nftables
      run: make test

    - name: Send coverage
      uses: shogo82148/actions-goveralls@v1
      continue-on-error: true
      with:
        path-to-profile: profile.cov
        flag-name: "Go-${{ matrix.go-version }}-${{ matrix.os }}"
        parallel: true

    # The tc flower backend against a simulated switchdev NIC (netdevsim with
    # VF representors), plus its veth tests again with streamed output. This
    # is a step of its own, after the coverage run and with a time limit,
    # because it creates and removes kernel devices.
    - name: Test the tc flower backend on a simulated switchdev NIC
      timeout-minutes: 5
      run: |
        uname -r
        # netdevsim lives in the modules-extra package on some runner images.
        sudo modprobe netdevsim || {
          sudo apt-get update -qq
          sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)"
        }
        # The runner is thrown away afterwards, so the simulated NIC is left
        # in place: removing a netdevsim device in switchdev mode did not
        # return on the 7.0 azure kernel.
        TCFLOWER_NETDEVSIM_KEEP=1 make test-tc-kernel

    - name: Kernel log of the simulated NIC test
      if: failure() || cancelled()
      run: sudo dmesg | tail -n 120

  # notifies that all test jobs are finished.
  finish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: shogo82148/actions-goveralls@v1
        continue-on-error: true
        with:
          parallel-finished: true
